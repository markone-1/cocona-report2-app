<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>作業日報</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fdf0f3">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f9; --card: #ffffff; --ink: #1f2933; --sub: #616e7c; --line: #d9dee5; --line-strong: #8f99a5;
    --accent: #0b63c5; --accent-ink: #ffffff; --ok: #1e7b3c; --err: #b42318; --warn: #9a5b00;
    --track: #e4e8ee; --shade: rgba(15, 23, 42, .45); --maxw: 1100px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --card: #1d232b; --ink: #e6e9ed; --sub: #9aa5b1; --line: #33404d; --line-strong: #7a8796;
      --accent: #4c9bf0; --accent-ink: #0b1220; --ok: #5cc27e; --err: #f07167; --warn: #e3a83c;
      --track: #2b3440; --shade: rgba(0, 0, 0, .6); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  header .in { max-width: var(--maxw); margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.2rem; margin: 0; }
  header small { font-weight: 400; font-size: .75rem; color: var(--sub); }
  main { max-width: var(--maxw); margin: 0 auto; padding: 16px; }
  @media (orientation: landscape) { main { max-width: 50vw; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { appearance: none; border: 2px solid var(--line-strong); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 12px 16px; font-size: 1rem; cursor: pointer; font-family: inherit; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.green { background: #1e7b3c; border-color: #1e7b3c; color: #fff; font-weight: 600; }
  button.small { padding: 4px 10px; font-size: .9rem; border-width: 1px; }
  button:disabled { opacity: .45; cursor: default; }
  .icon-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border-radius: 50%; border-width: 1px; }
  .icon-btn svg { width: 24px; height: 24px; }
  .quit { padding: 8px 16px; border-color: var(--err); color: var(--err); font-weight: 600; }
  label { display: block; font-size: .9rem; color: var(--sub); margin: 12px 0 4px; }
  input[type=text], input[type=password], input[type=email], input[type=date] { padding: 10px; font-size: 1rem; font-family: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  input[type=date] { cursor: pointer; }
  .report-btns { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
  .report-btns #viewBtn { justify-self: start; }
  .report-btns #clearBtn { justify-self: end; }
  .wide { width: 100%; }
  .muted { color: var(--sub); font-size: .9rem; }
  .warn { color: var(--warn); }
  .hidden { display: none !important; }
  .mail-list { list-style: none; padding: 0; margin: 8px 0 0; }
  .mail-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 6px; background: var(--bg); word-break: break-all; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: var(--shade); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { font-size: 1.1rem; margin: 0; }
  .dlg-body { padding: 16px; }
  .dlg-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }
  .bar { height: 14px; background: var(--track); border-radius: 7px; overflow: hidden; margin: 14px 0 6px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 7px; transition: width .4s ease; }
  .bar.err > div { background: var(--err); } .bar.ok > div { background: var(--ok); }
  #stage { font-weight: 600; margin: 0; }
  #errMsg { color: var(--err); margin: 10px 0 0; white-space: pre-wrap; }
  .view-screen { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
  .view-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .view-head h2 { font-size: 1.05rem; margin: 0; }
  .view-body { flex: 1; overflow: auto; padding: 12px; }
  .paper { width: 1210px; margin: 0 auto 16px; padding: 16px; background: #fff; color: #000; color-scheme: light; border: 1px solid var(--line); }
  .paper h3 { margin: 0; text-align: center; color: #0070c0; font-size: 1.4rem; letter-spacing: .1em; }
  .paper .meta { display: flex; justify-content: space-between; gap: 16px; margin: 6px 0 10px; font-size: .9rem; }
  .paper table { border-collapse: collapse; width: 100%; table-layout: fixed; border: 2px solid #0070c0; }
  .paper th { background: #ddebf7; color: #0070c0; font-size: .78rem; padding: 4px 2px; border: 1px solid #7f9db9; line-height: 1.25; }
  .paper td { border: 1px solid #7f9db9; padding: 0; font-size: .85rem; vertical-align: middle; }
  .paper td input, .paper td textarea { width: 100%; border: 0; background: transparent; color: #000; font: inherit; padding: 5px 3px; display: block; resize: none; }
  .paper td input:focus, .paper td textarea:focus { outline: 2px solid #0b63c5; outline-offset: -2px; background: #fffbe6; }
  .paper td.n input { text-align: right; }
  .paper td.c input { text-align: center; }
  .paper td.b input { font-weight: 700; }
  .paper td.no { text-align: center; }
  .paper tr.sub td { background: #f2f2f2; font-weight: 700; padding: 5px 3px; text-align: right; }
  .paper tr.total td { background: #d9d9d9; font-weight: 700; padding: 6px 3px; text-align: right; font-size: .95rem; border-top: 2px solid #0070c0; }
  .paper .del { padding: 2px 8px; border-width: 1px; font-size: .85rem; background: #fff; color: #000; border-color: #8f99a5; }
  .paper .foot { display: flex; justify-content: flex-end; align-items: center; margin-top: 8px; font-size: .8rem; }
  .paper .add { padding: 6px 12px; font-size: .9rem; border-width: 1px; background: #fff; color: #0b63c5; border-color: #0b63c5; }
  .quit-screen { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; text-align: center; padding: 24px; }
  .quit-title { font-size: 1.4rem; font-weight: 700; margin: 0 0 8px; }
</style>
</head>
<body>
<header><div class="in">
  <h1>作業日報 <small>Ver 11/02-j</small></h1>
  <div class="row" style="flex-wrap:nowrap;gap:8px">
    <button class="icon-btn" id="openSettings" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <button id="quitApp" class="quit">終了</button>
  </div>
</div></header>

<div id="quitScreen" class="quit-screen hidden"><div>
  <p class="quit-title">終了しました</p>
  <p class="muted" id="quitMsg"></p>
  <p class="muted">この画面を閉じてください。</p>
  <button id="restart" class="primary">もう一度使う</button>
</div></div>

<div id="viewScreen" class="view-screen hidden">
  <div class="view-head">
    <h2 id="viewTitle">作業日報</h2>
    <div class="row" style="flex-wrap:nowrap;gap:8px">
      <button id="viewCancel">キャンセル</button>
      <button id="viewSave" class="primary">保存</button>
    </div>
  </div>
  <div class="view-body" id="viewBody"></div>
</div>

<main>
  <section class="card">
    <h2>1. 日報作成</h2>
    <div class="row">
      <input type="date" id="workDate" aria-label="作業日">
      <button id="fetchBtn" class="primary">日報作成</button>
    </div>
    <p class="warn" id="why" style="margin:8px 0 0"></p>
  </section>
  <section class="card">
    <h2>2. 日報の表示・メール送信</h2>
    <div class="report-btns">
      <button id="viewBtn" class="primary" disabled>日報を表示</button>
      <button id="mailBtn" class="green" disabled>メール送信</button>
      <button id="clearBtn" class="quit" disabled>データクリア</button>
    </div>
    <p class="muted" id="status" style="margin:8px 0 0"></p>
  </section>
</main>

<dialog id="settingsDlg">
  <div class="dlg-head"><h2>設定</h2><button class="icon-btn" id="closeSettings" aria-label="閉じる">✕</button></div>
  <div class="dlg-body">
    <p class="muted" style="margin:0">設定はこのタブレットのブラウザ内にだけ保存されます。</p>
    <label for="repo">処理用リポジトリ（ユーザー名/リポジトリ名）</label>
    <input type="text" class="wide" id="repo" autocomplete="off">
    <label for="token">GitHub アクセストークン</label>
    <input type="password" class="wide" id="token" autocomplete="off">
    <label for="mailInput" style="margin-top:18px">日報の送信先メールアドレス</label>
    <div class="row" style="flex-wrap:nowrap">
      <input type="email" class="wide" id="mailInput" placeholder="example@example.com" autocomplete="off" inputmode="email">
      <button id="mailAdd" style="flex:none">登録</button>
    </div>
    <ul class="mail-list" id="mailList"></ul>
  </div>
  <div class="dlg-foot"><button id="cancelCfg">キャンセル</button><button id="saveCfg" class="primary">保存</button></div>
</dialog>

<dialog id="mailDlg">
  <div class="dlg-head"><h2>メール送信</h2><button class="icon-btn" id="closeMail" aria-label="閉じる">✕</button></div>
  <div class="dlg-body">
    <p style="margin:0 0 10px">表示中の日報を Excel ファイルにして送信します。</p>
    <p class="muted" style="margin:0 0 4px">送信先</p>
    <p id="mailToText" style="margin:0 0 14px;word-break:break-all"></p>
    <div class="row">
      <button id="sendNow" class="green">送信</button>
    </div>
  </div>
</dialog>

<dialog id="askDlg">
  <div class="dlg-body"><p id="askMsg" style="margin:0;white-space:pre-wrap"></p></div>
  <div class="dlg-foot"><button id="askNo">キャンセル</button><button id="askYes" class="primary">OK</button></div>
</dialog>

<dialog id="progDlg">
  <div class="dlg-head"><h2 id="progTitle">処理中</h2></div>
  <div class="dlg-body">
    <p id="stage">準備中…</p>
    <div class="bar" id="bar"><div id="barFill"></div></div>
    <p class="muted" style="margin:0"><span id="elapsed">0秒</span></p>
    <p id="errMsg" class="hidden"></p>
  </div>
  <div class="dlg-foot"><button id="closeProg" class="primary" disabled>処理中…</button></div>
</dialog>

<script>
"use strict";
const API = "https://api.github.com";
const WORKFLOW = "nippo.yml";
const DEFAULT_REPO = "markone-1/cocona-report2";
const $ = (s) => document.querySelector(s);
// 確認・お知らせはアプリ内の画面で出す（アプリ内ブラウザ等では confirm が出ずに自動でキャンセルになるため）
function ask(msg, yes = "OK", one = false) {
  return new Promise((resolve) => {
    const d = $("#askDlg"), done = (v) => { d.close(); resolve(v); };
    $("#askMsg").textContent = msg; $("#askYes").textContent = yes; $("#askNo").classList.toggle("hidden", one);
    $("#askYes").onclick = () => done(true); $("#askNo").onclick = () => done(false);
    d.oncancel = (e) => { e.preventDefault(); done(false); };
    d.showModal();
  });
}
const note = (msg) => ask(msg, "OK", true);

// ── 設定（同じサイトの作業日報OCRと混ざらないよう nippo_ を付けて保存。トークンは旧アプリの設定があれば引き継ぐ） ──
const mem = {};
let storageOk = true;
const store = {
  get(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch {} return mem[k] || ""; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch { storageOk = false; } },
};
// ブラウザが容量整理で設定を消さないよう、保存データの保持を依頼する
navigator.storage?.persist?.().catch(() => {});
function cfg() { return { repo: store.get("nippo_repo") || DEFAULT_REPO, token: store.get("nippo_token") || store.get("token") }; }
function mailTo() { try { return JSON.parse(store.get("nippo_mailTo") || "[]"); } catch { return []; } }
function updateUI() {
  const c = cfg();
  $("#fetchBtn").disabled = busy || !c.token;
  $("#why").textContent = c.token ? "" : "※ 右上の歯車から「GitHub アクセストークン」を入力して保存してください";
  $("#viewBtn").disabled = busy || !report;
  $("#mailBtn").disabled = busy || !report;
  $("#clearBtn").disabled = busy || !report;
}
function renderMail() {
  $("#mailList").innerHTML = "";
  mailTo().forEach((addr, i) => {
    const li = document.createElement("li");
    li.innerHTML = "<span></span><button class=\"small\">削除</button>";
    li.querySelector("span").textContent = addr;
    li.querySelector("button").onclick = () => { const l = mailTo(); l.splice(i, 1); store.set("nippo_mailTo", JSON.stringify(l)); renderMail(); updateUI(); };
    $("#mailList").appendChild(li);
  });
}
$("#openSettings").onclick = () => { const c = cfg(); $("#repo").value = c.repo; $("#token").value = c.token; renderMail(); $("#settingsDlg").showModal(); };
$("#closeSettings").onclick = $("#cancelCfg").onclick = () => $("#settingsDlg").close();
$("#saveCfg").onclick = () => {
  const repo = $("#repo").value.trim(), token = $("#token").value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return note("処理用リポジトリは「ユーザー名/リポジトリ名」の形で入力してください");
  if (!token) return note("GitHub アクセストークンを入力してください");
  store.set("nippo_repo", repo); store.set("nippo_token", token);
  if (!storageOk) note("このブラウザでは設定を保存できません。シークレットモードを使っていないか確認してください。");
  $("#settingsDlg").close(); updateUI();
};
$("#mailAdd").onclick = () => {
  const a = $("#mailInput").value.trim();
  if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(a)) return note("メールアドレスの形式が正しくありません");
  const l = mailTo(); if (l.includes(a)) return note("このアドレスは登録済みです");
  l.push(a); store.set("nippo_mailTo", JSON.stringify(l)); $("#mailInput").value = ""; renderMail(); updateUI();
};

// ── サーバー通信 ──
function gh(path, opt = {}) {
  const c = cfg(), body = opt.body ? JSON.stringify(opt.body) : null;
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    // GitHub の応答はブラウザに最大60秒残るので、状態確認で古い内容を読まないよう毎回別の URL にする
    const fresh = opt.method ? "" : (path.includes("?") ? "&" : "?") + "_=" + Date.now();
    x.open(opt.method || "GET", API + `/repos/${c.repo}` + path + fresh);
    x.timeout = 90000;
    x.setRequestHeader("Authorization", "Bearer " + c.token);
    x.setRequestHeader("Accept", "application/vnd.github+json");
    x.setRequestHeader("X-GitHub-Api-Version", "2022-11-28");
    if (body) x.setRequestHeader("Content-Type", "application/json");
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) return resolve(x.status === 204 || !x.responseText ? null : JSON.parse(x.responseText));
      if (opt.allow404 && x.status === 404) return resolve(null);
      reject(new Error(`サーバーエラー ${x.status}: ${(x.responseText || "").slice(0, 160)}`));
    };
    x.ontimeout = () => reject(new Error("通信が応答しません（電波・Wi-Fiを確認）"));
    x.onerror = () => reject(new Error("通信できません（電波・Wi-Fi・設定を確認）"));
    x.send(body);
  });
}
function unb64(s) {
  const bin = atob(s.replace(/\s/g, "")), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const prog = {
  t0: 0, timer: null, stoppable: false,
  open(title, stoppable) {
    this.t0 = Date.now(); $("#progTitle").textContent = title; $("#bar").className = "bar"; $("#errMsg").classList.add("hidden");
    this.stoppable = stoppable; $("#closeProg").disabled = !stoppable; $("#closeProg").textContent = stoppable ? "キャンセル" : "処理中…"; this.set(3, "準備中…");
    this.timer = setInterval(() => $("#elapsed").textContent = `${Math.round((Date.now() - this.t0) / 1000)}秒`, 1000);
    $("#progDlg").showModal();
  },
  set(p, stage) { $("#barFill").style.width = Math.min(100, p) + "%"; if (stage) $("#stage").textContent = stage; },
  noStop() { this.stoppable = false; $("#closeProg").disabled = true; },
  abort() { clearInterval(this.timer); this.stoppable = false; $("#progDlg").close(); },
  finish(ok, msg, nextLabel, nextFn) {
    clearInterval(this.timer); this.stoppable = false;
    progNext = nextFn || null;
    if (ok) { this.set(100, msg); $("#bar").className = "bar ok"; }
    else { $("#bar").className = "bar err"; $("#stage").textContent = "エラーで中断しました"; $("#errMsg").textContent = msg; $("#errMsg").classList.remove("hidden"); }
    $("#closeProg").disabled = false; $("#closeProg").textContent = nextLabel || "閉じる";
  },
};
let progNext = null;
$("#closeProg").onclick = () => {
  if (prog.stoppable) { // 実行中ならキャンセルを受け付ける
    cancelJob = true; prog.noStop();
    $("#closeProg").textContent = "キャンセル中…"; $("#stage").textContent = "キャンセル中…";
    return;
  }
  $("#progDlg").close(); if (progNext) { const f = progNext; progNext = null; f(); }
};
$("#progDlg").addEventListener("cancel", (e) => { if (busy) e.preventDefault(); });

const CANCELLED = new Error("キャンセルしました");
let cancelJob = false;
// 実行中の処理を止める（COCONA は処理側の finally でログアウトする）。止まるまで時間がかかるので、
// 画面は先に閉じ、止まるのを裏で待ってから処理記録と送信データを消す
async function stopRun(branch) {
  const find = async () => (await gh(`/actions/workflows/${WORKFLOW}/runs?branch=${encodeURIComponent(branch)}&per_page=5`)).workflow_runs[0];
  let run = null;
  for (let i = 0; i < 10 && !run; i++) { run = await find(); if (!run) await sleep(2000); }
  if (run && run.status !== "completed") { try { await gh(`/actions/runs/${run.id}/cancel`, { method: "POST" }); } catch {} }
  (async () => {
    try {
      for (let i = 0; i < 60; i++) {
        run = await find();
        if (run?.status === "completed") { await gh(`/actions/runs/${run.id}`, { method: "DELETE", allow404: true }); break; }
        await sleep(3000);
      }
    } catch {}
    try { await gh(`/git/refs/heads/${branch}`, { method: "DELETE", allow404: true }); } catch {}
  })();
}
// 一時ブランチに依頼を置いて処理を起動し、結果を受け取って、送信データと処理記録を消す
async function runJob(request, stageText) {
  const n = new Date(), p2 = (x) => String(x).padStart(2, "0");
  const jobId = `${n.getFullYear()}${p2(n.getMonth() + 1)}${p2(n.getDate())}${p2(n.getHours())}${p2(n.getMinutes())}${p2(n.getSeconds())}-` + Math.random().toString(36).slice(2, 6).padEnd(4, "0");
  const branch = `job/${jobId}`;
  let runId = null, sent = false, wake = null;
  try { wake = await navigator.wakeLock?.request("screen"); } catch {}
  try {
    prog.set(8, stageText);
    const main = await gh("/git/ref/heads/main");
    const base = await gh(`/git/commits/${main.object.sha}`);
    const tree = [{ path: "in/request.json", mode: "100644", type: "blob", content: JSON.stringify(request) }];
    const t = await gh("/git/trees", { method: "POST", body: { base_tree: base.tree.sha, tree } });
    const c = await gh("/git/commits", { method: "POST", body: { message: `job ${jobId}`, tree: t.sha, parents: [main.object.sha] } });
    await gh("/git/refs", { method: "POST", body: { ref: `refs/heads/${branch}`, sha: c.sha } });
    sent = true;
    if (cancelJob) throw CANCELLED;
    await gh(`/actions/workflows/${WORKFLOW}/dispatches`, { method: "POST", body: { ref: branch, inputs: { job_id: jobId } } });
    const r0 = Date.now(); let run = null;
    while (true) {
      await sleep(3000);
      if (cancelJob) throw CANCELLED;
      const sec = (Date.now() - r0) / 1000;
      if (sec > 300) throw new Error("時間切れ（5分）");
      prog.set(15 + 70 * (1 - Math.exp(-sec / 20)), stageText);
      const rs = await gh(`/actions/workflows/${WORKFLOW}/runs?branch=${encodeURIComponent(branch)}&per_page=5`);
      run = rs.workflow_runs[0];
      if (!run) continue;
      runId = run.id;
      if (run.status === "completed") break;
    }
    if (cancelJob) throw CANCELLED;
    prog.noStop();
    if (run.conclusion !== "success") throw new Error(`処理に失敗しました（${run.conclusion}）。\nしばらくしてからもう一度お試しください。続く場合は管理者に連絡してください。`);
    prog.set(90, "結果を受信中…");
    const ref = await gh(`/git/ref/heads/${branch}`);
    const head = await gh(`/git/commits/${ref.object.sha}`);
    const files = (await gh(`/git/trees/${head.tree.sha}?recursive=1`)).tree.filter((x) => x.path.startsWith("out/"));
    const get = async (sha) => unb64((await gh(`/git/blobs/${sha}`)).content);
    const json = async (name) => JSON.parse(new TextDecoder().decode(await get(files.find((x) => x.path === name).sha)));
    const res = await json("out/result.json");
    const out = { res };
    if (files.some((x) => x.path === "out/data.json")) out.data = await json("out/data.json");
    prog.set(97, "送信データを削除中…");
    await gh(`/actions/runs/${runId}`, { method: "DELETE", allow404: true });
    await gh(`/git/refs/heads/${branch}`, { method: "DELETE", allow404: true });
    return out;
  } catch (e) {
    if (sent && e === CANCELLED) { try { await stopRun(branch); } catch {} throw e; }
    if (sent) { try { await gh(`/git/refs/heads/${branch}`, { method: "DELETE", allow404: true }); } catch {} }
    throw e;
  } finally {
    try { await wake?.release(); } catch {}
  }
}

// ── 取得・表示・メール送信 ──
const DRAFT = "nippo_draft";
let report = null, busy = false; // report = {data, edited} 編集内容はこのタブレットにだけ保存し、終了で消す
function saveDraft() { store.set(DRAFT, report ? JSON.stringify(report) : ""); }
function reportLabel() {
  const d = report.data, y = d.date.replace(/-/g, "");
  return `作業日報_${y}（清掃 ${d.seisou.length}件・点検 ${d.tenken.length}件）`;
}
async function act(title, fn, stoppable = false) {
  busy = true; cancelJob = false; updateUI(); prog.open(title, stoppable);
  try {
    const r = await fn();
    if (typeof r === "string") prog.finish(true, r); else prog.finish(true, r.msg, r.next, r.after);
  } catch (e) { if (e === CANCELLED) prog.abort(); else prog.finish(false, e.message); }
  finally { busy = false; updateUI(); }
}
$("#fetchBtn").onclick = async () => {
  const d = $("#workDate").value;
  if (!d) return note("作業日を選んでください");
  if (report?.edited && !(await ask("編集した日報は破棄されます。作成し直しますか？"))) return;
  act("日報作成", async () => {
    const r = await runJob({ mode: "fetch", date: d }, `${d.replace(/-/g, "/")} の日報作成中`);
    if (r.res.error) throw new Error(r.res.error);
    report = { data: r.data, edited: false }; saveDraft();
    $("#status").textContent = reportLabel();
    return { msg: `作成しました：${reportLabel()}`, next: "日報を表示", after: openView };
  }, true);
};

// 日報の表示・編集：Excel と同じ並びの紙面をアプリ内に表示する（列の定義は build_nippo.py と合わせる）
const AREAS = ["下田", "南伊豆", "河津", "東伊豆", "松崎", "西伊豆"];
const SUM_KEYS = ["main", "touyaku", "plate", "sonota", "uriage", "genkin"];
const PARTS = ["main", "touyaku", "plate", "sonota"];
// [キー, 見出し, 幅px, 書式] n=数値 c=中央 t=折り返し b=太字
const VIEW_COLS = {
  seisou: [["area", "地区", 62, "c"], ["customer_no", "顧客番号", 64, "c"], ["name", "得意先", 124, "t"], ["address", "設置場所", 160, "t"],
    ["tantou", "担当", 54, "c"], ["persons", "人槽", 40, "n"], ["volume", "処理量(㎥)", 52, "n"], ["paren", "( )内記入値", 54, "n"],
    ["main", "清掃", 66, "n"], ["touyaku", "投薬", 54, "n"], ["plate", "プレート", 54, "n"], ["sonota", "その他", 54, "n"],
    ["uriage", "売上額", 68, "nb"], ["genkin", "現金入金", 62, "n"], ["bikou", "備考", 170, "t"]],
  tenken: [["area", "地区", 62, "c"], ["customer_no", "顧客番号", 64, "c"], ["name", "得意先", 136, "t"], ["address", "設置場所", 200, "t"],
    ["tantou", "点検者", 54, "c"], ["persons", "人槽", 40, "n"], ["main", "点検", 66, "n"], ["touyaku", "投薬", 54, "n"],
    ["plate", "プレート", 54, "n"], ["sonota", "その他", 54, "n"], ["uriage", "売上額", 68, "nb"], ["genkin", "現金入金", 62, "n"],
    ["bikou", "備考", 170, "t"]],
};
let edit = null, viewDirty = false;
const toNum = (v) => { const n = parseFloat(String(v ?? "").replace(/[,¥円\s]/g, "")); return isNaN(n) ? 0 : n; };
const fmt = (n) => n ? n.toLocaleString("ja-JP") : "";
const showVal = (key, v) => SUM_KEYS.includes(key) && v !== "" && !isNaN(Number(v)) ? fmt(Number(v)) : (v ?? "");
function wareki(ds) { const [y, m, d] = ds.split("-").map(Number); return `令和${y - 2018}年${m}月${d}日`; }
function peopleLabel(rows, label) {
  const groups = new Map();
  rows.forEach((r) => {
    const t = String(r.tantou ?? "").trim(); if (!t) return;
    const a = r.area || ""; if (!groups.has(a)) groups.set(a, []);
    if (!groups.get(a).includes(t)) groups.get(a).push(t);
  });
  if (groups.size <= 1) return `${label}：` + [...groups.values()].flat().join("・");
  return `${label}：` + [...groups].map(([a, l]) => `${l.join("・")}（${a}）`).join("／");
}
const el = (tag, cls, text) => { const x = document.createElement(tag); if (cls) x.className = cls; if (text !== undefined) x.textContent = text; return x; };
function areaOrder(rows) {
  const a = [...new Set(rows.map((r) => r.area || "地区なし"))];
  return a.sort((p, q) => { const i = AREAS.indexOf(p), j = AREAS.indexOf(q); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j) || p.localeCompare(q, "ja"); });
}
function refreshSums(kind) {
  const rows = edit[kind], box = $(`#view_${kind}`);
  box.querySelectorAll("[data-sum]").forEach((c) => {
    const [area, key] = c.dataset.sum.split("|");
    c.textContent = fmt(rows.filter((r) => !area || (r.area || "地区なし") === area).reduce((t, r) => t + toNum(r[key]), 0));
  });
  box.querySelector(".people").textContent = peopleLabel(rows, kind === "seisou" ? "記入者" : "点検者");
}
function makeCell(kind, row, tr, [key, , , f]) {
  const td = el("td", f.includes("n") ? "n" : f.includes("c") ? "c" : ""); if (f.includes("b")) td.classList.add("b");
  const inp = el(f.includes("t") ? "textarea" : "input");
  if (f.includes("t")) inp.rows = 2;
  if (f.includes("n")) inp.inputMode = "decimal";
  inp.value = showVal(key, row[key]); inp.dataset.key = key; inp.setAttribute("aria-label", key);
  inp.oninput = () => {
    row[key] = inp.value; viewDirty = true;
    if (PARTS.includes(key)) { // 売上額は内訳の合計に自動更新
      const t = PARTS.reduce((v, k) => v + toNum(row[k]), 0);
      row.uriage = t || ""; tr.querySelector('[data-key="uriage"]').value = showVal("uriage", row.uriage);
    }
    refreshSums(kind);
  };
  if (key === "area") inp.onchange = () => renderView(); // 地区を変えたら小計の並びも作り直す
  td.appendChild(inp);
  return td;
}
function renderSection(kind, title) {
  const cols = VIEW_COLS[kind], rows = edit[kind], box = el("section", "paper"); box.id = `view_${kind}`;
  box.appendChild(el("h3", "", title));
  const meta = el("div", "meta");
  meta.append(el("span", "", `作業日：${wareki(edit.date)}`), el("span", "people"));
  box.appendChild(meta);
  const t = el("table"), cg = el("colgroup");
  [...cols.map((c) => c[2]), 34].forEach((w) => { const c = el("col"); c.style.width = w + "px"; cg.appendChild(c); });
  t.appendChild(cg);
  const hr = t.insertRow(); cols.forEach((c) => hr.appendChild(el("th", "", c[1]))); hr.appendChild(el("th"));
  const firstSum = cols.findIndex((c) => SUM_KEYS.includes(c[0]));
  const sumRow = (cls, label, area) => {
    const tr = t.insertRow(); tr.className = cls;
    const c = tr.insertCell(); c.colSpan = firstSum; c.textContent = label;
    cols.slice(firstSum).forEach(([key]) => { const x = tr.insertCell(); if (SUM_KEYS.includes(key)) x.dataset.sum = `${area}|${key}`; });
    tr.insertCell();
  };
  areaOrder(rows).forEach((a) => {
    const list = rows.filter((r) => (r.area || "地区なし") === a);
    list.forEach((row) => {
      const tr = t.insertRow();
      cols.forEach((c) => tr.appendChild(makeCell(kind, row, tr, c)));
      const td = tr.insertCell(); td.className = "no";
      const del = el("button", "del", "×"); del.setAttribute("aria-label", "行を削除");
      del.onclick = async () => { if (await ask("この行を削除しますか？")) { rows.splice(rows.indexOf(row), 1); viewDirty = true; renderView(); } };
      td.appendChild(del);
    });
    sumRow("sub", `${a} 小計（${list.length}件）`, a);
  });
  if (!rows.length) { const c = t.insertRow().insertCell(); c.colSpan = cols.length + 1; c.style.padding = "10px"; c.style.textAlign = "center"; c.textContent = "COCONAにこの作業日の登録はありません"; }
  sumRow("total", `合　計（${rows.length}件）`, "");
  box.appendChild(t);
  const foot = el("div", "foot"), add = el("button", "add", "＋ 行を追加");
  add.onclick = () => {
    rows.push({ area: "", customer_no: "", name: "", address: "", tantou: "", persons: "", volume: "", paren: "", main: "", touyaku: "", plate: "", sonota: "", uriage: "", genkin: "", bikou: "" });
    viewDirty = true; renderView();
  };
  foot.append(add);
  box.appendChild(foot);
  return box;
}
function renderView() {
  const b = $("#viewBody"), top = b.scrollTop, left = b.scrollLeft;
  b.replaceChildren(renderSection("seisou", "清 掃 作 業 日 報（売上）"), renderSection("tenken", "点 検 作 業 日 報（売上）"));
  refreshSums("seisou"); refreshSums("tenken");
  b.scrollTop = top; b.scrollLeft = left;
}
function openView() {
  edit = JSON.parse(JSON.stringify(report.data)); viewDirty = false;
  $("#viewTitle").textContent = `作業日報 ${wareki(edit.date)}`;
  renderView();
  $("#viewScreen").classList.remove("hidden");
  $("#viewBody").scrollTop = 0;
}
$("#viewBtn").onclick = openView;
$("#viewSave").onclick = () => {
  if (viewDirty) { report.data = edit; report.edited = true; saveDraft(); }
  $("#status").textContent = reportLabel() + (report.edited ? "　編集を保存しました" : "");
  $("#viewScreen").classList.add("hidden");
};
$("#viewCancel").onclick = async () => {
  if (viewDirty && !(await ask("編集した内容を破棄しますか？"))) return;
  $("#viewScreen").classList.add("hidden");
};
$("#mailBtn").onclick = () => {
  const to = mailTo();
  if (!to.length) return note("右上の歯車から送信先メールアドレスを登録してください");
  $("#mailToText").textContent = to.join("、");
  $("#mailDlg").showModal();
};
$("#closeMail").onclick = () => $("#mailDlg").close();
$("#sendNow").onclick = () => {
  const to = mailTo();
  $("#mailDlg").close();
  act("メール送信", async () => {
    const r = await runJob({ mode: "mail", data: report.data, mail_to: to }, "メールを送信中…");
    if (r.res.error) throw new Error(r.res.error);
    resetReport();
    return `メールを送信しました（${r.res.mail_sent}件）`;
  });
};
// データを消して初期状態に戻す
function resetReport() {
  report = null; saveDraft();
  $("#workDate").value = today;
  $("#status").textContent = "";
  updateUI();
}
$("#clearBtn").onclick = async () => { if (await ask("日報のデータを削除しますか？", "データ削除")) resetReport(); };

// ── 終了：送信データ・処理記録を全削除（他端末の処理中ジョブは残す）して、画面上のデータを破棄 ──
$("#quitApp").onclick = async () => {
  if (busy) return note("処理中は終了できません。");
  if (!(await ask("アプリを終了しますか？\n画面のデータと、送信データ・処理の記録をすべて削除します。"))) return;
  const b = $("#quitApp"); b.disabled = true; b.textContent = "削除中…";
  let msg = "";
  try {
    if (cfg().token) {
      const runs = (await gh("/actions/runs?per_page=100")).workflow_runs;
      const active = new Set(runs.filter((r) => r.status !== "completed").map((r) => r.head_branch));
      const refs = (await gh("/git/matching-refs/heads/job/")) || [];
      let nb = 0, nr = 0;
      for (const r of refs) if (!active.has(r.ref.replace("refs/heads/", ""))) { await gh(`/git/${r.ref}`, { method: "DELETE", allow404: true }); nb++; }
      for (const r of runs) if (r.status === "completed") { await gh(`/actions/runs/${r.id}`, { method: "DELETE", allow404: true }); nr++; }
      msg = `送信データ ${nb} 件・処理の記録 ${nr} 件を削除しました。`;
    }
  } catch (e) { msg = "データの削除に失敗しました（" + e.message + "）。"; }
  b.disabled = false; b.textContent = "終了";
  report = null; saveDraft();
  $("#quitMsg").textContent = msg; $("#quitScreen").classList.remove("hidden");
  try { window.close(); } catch {}
};
$("#restart").onclick = () => location.reload();

const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
$("#workDate").value = today;
// 欄のどこを押してもカレンダーを開く（PC の Chrome は既定だと右端のアイコンでしか開かない）
$("#workDate").onclick = (e) => { try { e.currentTarget.showPicker(); } catch {} };
try { report = JSON.parse(store.get(DRAFT) || "null"); } catch {}
if (report) { $("#workDate").value = report.data.date; $("#status").textContent = reportLabel(); }
updateUI();
</script>
